<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InsightForge · 数据分析 Agent</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>InsightForge</h1>
  <span class="badge">数据分析 Agent</span>
  <span class="status"><span class="status-dot"></span>在线</span>
  <div id="userInfo" style="display:none;">
    <span id="userBadge"></span>
    <button class="btn-ghost" onclick="openChangePassword()">改密</button>
    <button class="btn-ghost" id="adminBtn" onclick="openAdmin()" style="display:none;">管理</button>
    <button class="btn-ghost" onclick="logout()">退出</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3>会话</h3>
      <button class="btn-icon" onclick="createSession()" title="新建会话">+ 新建</button>
    </div>
    <div id="sessionList" class="session-list scrollbar"></div>
    <div class="sidebar-footer">
      <div style="font-size:11px;color:var(--text-muted);text-align:center;">
        安全沙箱 · 数据不外泄
      </div>
    </div>
  </aside>

  <section class="content">
    <div id="events" class="events scrollbar">
      <div class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <p>开始新的数据分析</p>
        <p class="hint">输入你的问题，AI 将自动查询数据库并给出分析结果</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="taskInput" placeholder="输入分析任务，例如：查询销量最高的前5个商品" rows="1"></textarea>
        <button id="sendBtn" class="btn-primary" onclick="sendMessage()">发送</button>
        <button id="cancelBtn" class="btn-danger" onclick="cancelRun()" style="display:none;">取消</button>
      </div>
      <div class="examples">
        <span class="example-chip" onclick="useExample('查询 ecommerce.db 中销量最高的前5个商品')">销量Top5商品</span>
        <span class="example-chip" onclick="useExample('统计各城市的销售额分布')">各城市销售额</span>
        <span class="example-chip" onclick="useExample('分析用户复购率最高的商品类别')">复购率分析</span>
        <span class="example-chip" onclick="useExample('按月统计订单量和销售额趋势')">月度趋势</span>
      </div>
    </div>
  </section>
</div>

<!-- Login -->
<div id="loginOverlay" class="overlay" style="display:none;">
  <div class="modal">
    <h2>InsightForge 登录</h2>
    <input id="loginUser" class="form-input" placeholder="用户名" autocomplete="username">
    <input id="loginPass" class="form-input" type="password" placeholder="密码" autocomplete="current-password">
    <div id="loginError" class="form-error"></div>
    <button onclick="doLogin()" class="btn-primary" style="width:100%;">登录</button>
    <p class="form-hint" style="margin-top:12px;text-align:center;">默认账号：admin / admin123</p>
  </div>
</div>

<!-- Change Password -->
<div id="chgPwOverlay" class="overlay" style="display:none;">
  <div class="modal">
    <h2>修改密码</h2>
    <p id="chgPwForced" style="display:none;background:#7c2d12;color:#fdba74;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px;">
      首次登录必须修改默认密码后才能继续使用
    </p>
    <input id="chgPwOld" type="password" class="form-input" placeholder="当前密码" autocomplete="current-password">
    <input id="chgPwNew" type="password" class="form-input" placeholder="新密码（至少8位，含大小写字母和数字）" autocomplete="new-password">
    <input id="chgPwConfirm" type="password" class="form-input" placeholder="确认新密码" autocomplete="new-password">
    <div id="chgPwError" class="form-error"></div>
    <button onclick="doChangePassword()" class="btn-primary" style="width:100%;">确认修改</button>
    <button id="chgPwCancel" onclick="closeChangePassword()" class="btn-secondary" style="width:100%;margin-top:8px;">取消</button>
  </div>
</div>

<!-- Admin Panel -->
<div id="adminOverlay" class="overlay" style="display:none;">
  <div class="modal wide">
    <div class="modal-header">
      <h2>用户管理</h2>
      <button class="btn-ghost" onclick="closeAdmin()">关闭</button>
    </div>
    <div style="margin-bottom:16px;">
      <button class="btn-primary" onclick="openRegister()">+ 创建用户</button>
    </div>
    <table class="admin-table" id="usersTable">
      <thead>
        <tr><th>用户名</th><th>角色</th><th>修改角色</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Register -->
<div id="regOverlay" class="overlay" style="display:none;">
  <div class="modal">
    <h2>创建用户</h2>
    <input id="regUser" class="form-input" placeholder="用户名">
    <input id="regPass" type="password" class="form-input" placeholder="密码（至少8位，含大小写字母和数字）">
    <select id="regRole" class="form-input">
      <option value="analyst">analyst</option>
      <option value="viewer">viewer</option>
      <option value="admin">admin</option>
    </select>
    <div id="regError" class="form-error"></div>
    <button onclick="doRegister()" class="btn-primary" style="width:100%;">创建</button>
    <button onclick="closeRegister()" class="btn-secondary" style="width:100%;margin-top:8px;">取消</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
